<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Kurush Digital — цифровая инфраструктура для бизнеса</title>
    
    <!-- Подключаем Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

    <style>
        /* ============================================================ */
        /* БАЗОВЫЕ СТИЛИ */
        /* ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0A0A1A;
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --border-glass: rgba(255, 255, 255, 0.06);
            
            --blue: #1A73E8;
            --purple: #9C27B0;
            --green: #00E676;
            --gradient-main: linear-gradient(135deg, #1A73E8 0%, #9C27B0 50%, #00E676 100%);
            --gradient-card: linear-gradient(135deg, rgba(26, 115, 232, 0.1), rgba(156, 39, 176, 0.1));
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ============================================================ */
        /* АНИМИРОВАННЫЙ ФОН */
        /* ============================================================ */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatOrb 20s ease-in-out infinite alternate;
        }

        .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: var(--blue);
            top: -100px;
            left: -100px;
            animation-duration: 25s;
        }

        .orb:nth-child(2) {
            width: 500px;
            height: 500px;
            background: var(--purple);
            bottom: -150px;
            right: -100px;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: var(--green);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 35s;
            animation-delay: -10s;
            opacity: 0.2;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -80px) scale(1.1); }
            66% { transform: translate(-40px, 60px) scale(0.9); }
            100% { transform: translate(30px, -30px) scale(1.05); }
        }

        /* ============================================================ */
        /* ШАПКА */
        /* ============================================================ */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo img {
            height: 40px;
            width: auto;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .logo-text span {
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-cta {
            background: var(--gradient-main);
            color: #fff !important;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600 !important;
            transition: opacity 0.3s ease, transform 0.3s ease !important;
            display: inline-block;
        }

        .nav-cta:hover {
            opacity: 0.9;
            transform: scale(1.02);
            color: #fff !important;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }

        .menu-toggle span {
            display: block;
            width: 28px;
            height: 2px;
            background: var(--text-primary);
            transition: all 0.3s ease;
        }

        /* ============================================================ */
        /* ГЕРОЙ (ГЛАВНЫЙ ЭКРАН) */
        /* ============================================================ */
        .hero {
            padding: 100px 0 80px;
            position: relative;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 700px;
        }

        .hero-badge {
            display: inline-block;
            background: var(--gradient-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            color: var(--green);
            font-weight: 500;
            width: fit-content;
        }

        .hero h1 {
            font-size: clamp(40px, 8vw, 68px);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -2px;
        }

        .hero h1 .highlight {
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 550px;
            line-height: 1.7;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--gradient-main);
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 32px;
            border-radius: 60px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-secondary:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        /* ============================================================ */
        /* БЛОК "ПОЧЕМУ МЫ" */
        /* ============================================================ */
        .section {
            padding: 80px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header h2 {
            font-size: clamp(30px, 5vw, 44px);
            font-weight: 700;
            letter-spacing: -1px;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 18px;
            max-width: 600px;
            margin: 12px auto 0;
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .why-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 32px 28px;
            transition: all 0.4s ease;
        }

        .why-card:hover {
            border-color: rgba(26, 115, 232, 0.3);
            transform: translateY(-6px);
        }

        .why-card .icon {
            font-size: 36px;
            margin-bottom: 20px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .why-card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .why-card p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.7;
        }

        /* ============================================================ */
        /* УСЛУГИ */
        /* ============================================================ */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }

        .service-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            transition: all 0.4s ease;
        }

        .service-card:hover {
            border-color: rgba(156, 39, 176, 0.3);
            transform: translateY(-4px);
        }

        .service-card .icon {
            font-size: 32px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 16px;
        }

        .service-card h4 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .service-card p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        /* ============================================================ */
        /* ПОРТФОЛИО */
        /* ============================================================ */
        .portfolio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .portfolio-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .portfolio-card:hover {
            border-color: rgba(0, 230, 118, 0.3);
            transform: translateY(-6px);
        }

        .portfolio-card.featured {
            grid-column: 1 / -1;
            background: var(--gradient-card);
        }

        .portfolio-card .card-body {
            padding: 32px 28px;
        }

        .portfolio-card .badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            background: rgba(0, 230, 118, 0.15);
            color: var(--green);
            padding: 4px 12px;
            border-radius: 40px;
            margin-bottom: 12px;
        }

        .portfolio-card h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .portfolio-card p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .portfolio-card .tech {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .portfolio-card .tech span {
            font-size: 12px;
            background: var(--bg-primary);
            padding: 4px 12px;
            border-radius: 20px;
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
        }

        .portfolio-card .card-link {
            color: var(--blue);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: gap 0.3s ease;
        }

        .portfolio-card .card-link:hover {
            gap: 14px;
        }

        .portfolio-card .card-link.green {
            color: var(--green);
        }

        /* ============================================================ */
        /* БЛОК "СКОРО" */
        /* ============================================================ */
        .soon-block {
            text-align: center;
            padding: 60px 40px;
            background: var(--gradient-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            margin: 40px 0;
        }

        .soon-block .icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        .soon-block h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .soon-block p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* ============================================================ */
        /* CTA (ПРИЗЫВ К ДЕЙСТВИЮ) */
        /* ============================================================ */
        .cta-block {
            text-align: center;
            padding: 60px 40px;
            background: var(--gradient-card);
            border: 1px solid var(--border-glass);
            border-radius: 32px;
            margin: 40px 0 60px;
        }

        .cta-block h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .cta-block p {
            color: var(--text-secondary);
            font-size: 18px;
            max-width: 500px;
            margin: 0 auto 24px;
        }

        /* ============================================================ */
        /* ФУТЕР */
        /* ============================================================ */
        footer {
            border-top: 1px solid var(--border-glass);
            padding: 40px 0 30px;
            margin-top: 20px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 40px;
        }

        .footer-brand .logo {
            margin-bottom: 16px;
        }

        .footer-brand p {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 300px;
            line-height: 1.7;
        }

        .footer-col h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col ul li {
            margin-bottom: 10px;
        }

        .footer-col ul a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .footer-col ul a:hover {
            color: var(--text-primary);
        }

        .footer-social {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }

        .footer-social a {
            color: var(--text-secondary);
            font-size: 20px;
            transition: color 0.3s ease;
        }

        .footer-social a:hover {
            color: var(--text-primary);
        }

        .footer-bottom {
            border-top: 1px solid var(--border-glass);
            margin-top: 40px;
            padding-top: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ============================================================ */
        /* АДАПТИВНОСТЬ */
        /* ============================================================ */
        @media (max-width: 992px) {
            .portfolio-grid {
                grid-template-columns: 1fr;
            }
            .footer-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                background: var(--bg-primary);
                padding: 20px;
                border-radius: 16px;
                border: 1px solid var(--border-glass);
                position: absolute;
                top: 70px;
                right: 20px;
                width: 240px;
                gap: 16px;
            }
            .nav-links.open {
                display: flex;
            }
            .menu-toggle {
                display: flex;
            }
            .hero {
                padding: 60px 0;
            }
            .hero h1 {
                font-size: 32px;
            }
            .hero p {
                font-size: 16px;
            }
            .footer-grid {
                grid-template-columns: 1fr;
            }
            .services-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .services-grid {
                grid-template-columns: 1fr;
            }
            .cta-block {
                padding: 30px 20px;
            }
            .soon-block {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- АНИМИРОВАННЫЙ ФОН -->
    <!-- ============================================================ -->
    <div class="animated-bg">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- ============================================================ -->
    <!-- ШАПКА -->
    <!-- ============================================================ -->
    <header>
