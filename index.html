<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техническое обслуживание | Kurush Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] flex flex-col min-h-screen text-white font-sans">

    <!-- Основной контент -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-md w-full text-center">
            <!-- Логотип -->
            <div class="mb-8">
                <img src="https://i.ibb.co/1G0yvy1B/file-00000000a2507243b7e45f572fc19aaf.png" 
                     alt="Kurush Digital Logo" 
                     class="mx-auto w-32 h-32 drop-shadow-[0_0_20px_rgba(16,185,129,0.2)]">
            </div>

            <!-- Заголовок и описание -->
            <h1 class="text-3xl font-bold mb-4 tracking-tight">Система на обновлении</h1>
            <p class="text-slate-400 mb-8 leading-relaxed">
                Мы проводим оптимизацию серверных мощностей для повышения стабильности работы. 
                У вас есть вопросы по текущему проекту или идеи для новых цифровых решений? 
                Давайте обсудим ваше видение напрямую с нашей командой.
            </p>

            <!-- Кнопка действия -->
            <a href="https://t.me/kurush_digital" 
               class="block w-full bg-[#10b981] hover:bg-[#059669] text-white font-bold py-4 rounded-xl transition-all duration-300 transform hover:scale-[1.02] shadow-lg shadow-emerald-900/20">
                Связаться с поддержкой
            </a>
        </div>
    </main>

    <!-- Футер -->
    <footer class="p-6 text-center border-t border-slate-800">
        <a href="https://kurushdigital.one" class="text-slate-500 hover:text-emerald-500 transition-colors text-sm font-medium">
            kurushdigital.one
        </a>
    </footer>

</body>
</html>
